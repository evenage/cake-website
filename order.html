<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steamy Cake Creamery❤</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/cake.css">
</head>
<body>
    <div id="header"></div>

    <main>
        <section class="page-header">
            <h2>Complete Your Order 💕</h2>
            <p>Fill in your details below</p>
        </section>

        <section class="container order-section">
            <div id="orderDetails" class="order-grid">
                <div class="order-cake-info">
                    <p>Loading cake details...</p>
                </div>
                
                <div class="order-form">
                    <h3>Your Details</h3>
                    <form id="orderForm">
                        <label for="customerName">Full Name *</label>
                        <input type="text" id="customerName" required>

                        <label for="customerPhone">Phone Number *</label>
                        <input type="tel" id="customerPhone" placeholder="071 234 5678" required>

                        <label for="customerEmail">Email</label>
                        <input type="email" id="customerEmail" placeholder="you@example.com">

                        <label for="deliveryDate">Delivery/Pickup Date *</label>
                        <input type="date" id="deliveryDate" required>

                        <label for="message">Message on Cake</label>
                        <input type="text" id="message" placeholder="Happy Birthday John!">

                        <label for="specialRequests">Special Requests</label>
                        <textarea id="specialRequests" rows="3" placeholder="Any allergies or special instructions?"></textarea>

                        <button type="submit" class="btn">Place Order - R<span id="orderPrice">0</span></button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <div id="footer"></div>
    <script src="js/main.js"></script>
</body>
</html>
